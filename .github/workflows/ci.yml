name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build:e0
      - run: npm run e0:docx
      - run: npm run licenses
      - run: npm run legal
      - run: npm run icons
      - run: npm run size
      - run: npm audit --audit-level=high
